<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Houses Management', ~{::section})}">
<head><title>Houses Management</title></head>
<body>
<section>
    <!-- Breadcrumb -->
    <nav aria-label="breadcrumb" class="breadcrumb-bar">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/">Home</a></li>
            <li class="breadcrumb-item active" aria-current="page">Houses Management</li>
        </ol>
    </nav>

    <!-- Page Header -->
    <div class="page-header">
        <div>
            <h1 class="page-title">School Houses</h1>
            <p class="page-subtitle">Inter-house leagues, student allocations, tournament standings, and appointed faculty mentors.</p>
        </div>
    </div>

    <!-- Flash Messages -->
    <div th:replace="~{fragments/ui :: flash-messages}"></div>

    <!-- 4 House Cards Grid (Strict B&W) -->
    <div class="row g-4 mb-4">
        <div class="col-md-6 col-lg-3" th:each="h : ${houses}">
            <div class="card h-100" style="border: 1px solid #000;">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span style="font-weight: 700; text-transform: uppercase;" th:text="${h.houseName}">Red Dragons</span>
                    <span class="badge-outlined" th:text="'Colour: ' + ${h.color}">Colour: Red</span>
                </div>
                <div class="card-body">
                    <div class="mb-3">
                        <div class="text-muted" style="font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;">Tournaments Won</div>
                        <div class="stat-value" style="font-size: 28px;" th:text="${h.noOfWins}">5</div>
                    </div>

                    <table class="kv-table mb-3" style="font-size: 12px;">
                        <tr>
                            <td class="kv-label">House Captain</td>
                            <td>
                                <strong th:if="${h.captainId != null}" th:text="${h.captainName} + ' (' + ${h.captainId} + ')'">Rohan Mehta (A001)</strong>
                                <span th:if="${h.captainId == null}" class="text-muted">Unassigned</span>
                            </td>
                        </tr>
                        <tr>
                            <td class="kv-label">Faculty Mentors</td>
                            <td>
                                <span class="badge-filled" th:text="${h.mentorCount} + ' mentors'">2 mentors</span>
                            </td>
                        </tr>
                        <tr>
                            <td class="kv-label">Enrolled Students</td>
                            <td>
                                <span class="badge-outlined" th:text="${h.studentCount} + ' students'">65 students</span>
                            </td>
                        </tr>
                    </table>

                    <a th:href="@{'/admin/houses/' + ${h.color}}" class="btn btn-bw btn-sm w-100">
                        Manage House &rarr;
                    </a>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
