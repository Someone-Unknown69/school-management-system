<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(${mode == 'create' ? 'Add Staff Member' : 'Edit Staff — ' + staff.employeeId}, ~{::section})}">
<head><title>Staff Form</title></head>
<body>
<section>
    <!-- Breadcrumb -->
    <nav aria-label="breadcrumb" class="breadcrumb-bar">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/admin/dashboard">Dashboard</a></li>
            <li class="breadcrumb-item"><a href="/admin/faculty?tab=staff">Faculty &amp; Staff</a></li>
            <li class="breadcrumb-item active" aria-current="page" th:text="${mode == 'create' ? 'Add Staff' : 'Edit ' + staff.employeeId}">Staff Form</li>
        </ol>
    </nav>

    <!-- Page Header -->
    <div class="page-header">
        <div>
            <h1 class="page-title" th:text="${mode == 'create' ? 'Register New Staff Member' : 'Edit Staff Record — ' + staff.employeeId}">Staff Form</h1>
            <p class="page-subtitle">Configure operational staff employment records, designated role, and compensation.</p>
        </div>
    </div>

    <!-- Flash Messages -->
    <div th:replace="~{fragments/ui :: flash-messages}"></div>

    <form th:action="${mode == 'create' ? '/admin/faculty/staff/new' : '/admin/faculty/staff/edit/' + staff.employeeId}"
          method="post" class="needs-validation">

        <div class="card mb-4">
            <div class="card-header">Staff Employment Profile</div>
            <div class="card-body">
                <div class="row g-3">
                    <!-- Employee ID -->
                    <div class="col-md-4">
                        <label for="employeeId" class="form-label">Employee ID <span class="text-danger">*</span></label>
                        <input type="text" id="employeeId" name="employeeId"
                               th:value="${staff.employeeId}"
                               th:readonly="${mode == 'edit'}"
                               class="form-control"
                               placeholder="e.g. S003" required>
                        <div class="form-text" th:if="${mode == 'edit'}">Primary staff identifier cannot be modified.</div>
                    </div>

                    <!-- Designated Role -->
                    <div class="col-md-4">
                        <label for="designatedRole" class="form-label">Designated Role <span class="text-danger">*</span></label>
                        <select id="designatedRole" name="designatedRole" class="form-select" required>
                            <option value="" disabled th:selected="${staff.designatedRole == null or staff.designatedRole == ''}">-- Select Role --</option>
                            <option th:each="r : ${roles}"
                                    th:value="${r}"
                                    th:text="${r}"
                                    th:selected="${staff.designatedRole != null and staff.designatedRole.equalsIgnoreCase(r)}"></option>
                        </select>
                        <div class="form-text">Role "Driver" grants bus fleet roster access.</div>
                    </div>

                    <!-- Joining Date -->
                    <div class="col-md-4">
                        <label for="dateOfJoining" class="form-label">Joining Date <span class="text-danger">*</span></label>
                        <input type="date" id="dateOfJoining" name="dateOfJoining"
                               th:value="${staff.dateOfJoining}"
                               class="form-control" required>
                    </div>

                    <!-- First Name -->
                    <div class="col-md-4">
                        <label for="firstName" class="form-label">First Name <span class="text-danger">*</span></label>
                        <input type="text" id="firstName" name="firstName"
                               th:value="${staff.firstName}"
                               class="form-control" placeholder="First name" required>
                    </div>

                    <!-- Middle Name -->
                    <div class="col-md-4">
                        <label for="middleName" class="form-label">Middle Name</label>
                        <input type="text" id="middleName" name="middleName"
                               th:value="${staff.middleName}"
                               class="form-control" placeholder="Optional middle name">
                    </div>

                    <!-- Last Name -->
                    <div class="col-md-4">
                        <label for="lastName" class="form-label">Last Name</label>
                        <input type="text" id="lastName" name="lastName"
                               th:value="${staff.lastName}"
                               class="form-control" placeholder="Surname">
                    </div>

                    <!-- Contact Number -->
                    <div class="col-md-6">
                        <label for="contactNumber" class="form-label">Contact Telephone <span class="text-danger">*</span></label>
                        <input type="text" id="contactNumber" name="contactNumber"
                               th:value="${staff.contactNumber}"
                               class="form-control" placeholder="e.g. 9876500003" required>
                    </div>

                    <!-- Monthly Salary -->
                    <div class="col-md-6">
                        <label for="salary" class="form-label">Monthly Remuneration (₹) <span class="text-danger">*</span></label>
                        <input type="number" step="0.01" id="salary" name="salary"
                               th:value="${staff.salary}"
                               class="form-control" placeholder="25000" min="1" required>
                    </div>
                </div>
            </div>
        </div>

        <!-- Actions -->
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-bw">Save Staff Record</button>
            <a href="/admin/faculty?tab=staff" class="btn btn-bw-outline">Cancel</a>
        </div>
    </form>
</section>
</body>
</html>
