<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Enrolled Students — ' + ${subjectName}, ~{::section})}">
<head><title>Course Enrolled Students</title></head>
<body>
<section>
    <!-- Breadcrumb -->
    <nav aria-label="breadcrumb" class="breadcrumb-bar">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/teacher/dashboard">Dashboard</a></li>
            <li class="breadcrumb-item"><a href="/teacher/schedule">Teaching Schedule</a></li>
            <li class="breadcrumb-item active" aria-current="page" th:text="${subjectCode} + ' Students'">Course Students</li>
        </ol>
    </nav>

    <!-- Page Header -->
    <div class="page-header">
        <div>
            <h1 class="page-title" th:text="${subjectName} + ' (' + ${subjectCode} + ')'">Mathematics (MATH10)</h1>
            <p class="page-subtitle">
                Class: <strong th:text="'Class ' + ${standard} + ' - ' + ${division}">Class 10 - A</strong> &nbsp;|&nbsp;
                Instructor: <span th:text="${teacher.fullName}">Anita Verma</span>
            </p>
        </div>
    </div>

    <!-- Flash Messages -->
    <div th:replace="~{fragments/ui :: flash-messages}"></div>

    <!-- Enrolled Students Table -->
    <div class="table-responsive" th:if="${!#lists.isEmpty(enrolledStudents)}">
        <table class="table">
            <thead>
                <tr>
                    <th style="width: 80px;">Roll No</th>
                    <th style="width: 140px;">Admission No</th>
                    <th>Student Name</th>
                    <th style="width: 90px;">Class</th>
                    <th style="width: 90px;">Section</th>
                    <th style="width: 120px;">House</th>
                    <th style="width: 100px; text-align: center;">Current Grade</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="s : ${enrolledStudents}">
                    <td th:text="${s.rollNo}">1</td>
                    <td><strong th:text="${s.admissionNo}">A001</strong></td>
                    <td th:text="${s.firstName} + (${s.lastName != null} ? ' ' + ${s.lastName} : '')">Rohan Mehta</td>
                    <td th:text="${s.standard}">10</td>
                    <td th:text="${s.division}">A</td>
                    <td><span class="badge-outlined" th:text="${s.house}">Red</span></td>
                    <td style="text-align: center;">
                        <span th:if="${s.grade != null}" class="badge-filled" th:text="${s.grade}">A</span>
                        <span th:unless="${s.grade != null}" class="badge-muted">N/A</span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Empty State -->
    <div th:if="${#lists.isEmpty(enrolledStudents)}">
        <div th:replace="~{fragments/ui :: empty-state('👥', 'No Students Enrolled', 'There are no students enrolled in this course for this section.')}"></div>
    </div>
</section>
</body>
</html>
