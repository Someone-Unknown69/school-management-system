<!DOCTYPE html>
<!--
  error/404.html
  ==============
  Spring Boot serves this automatically when a route is not found.
  Same standalone pattern as 403.html — no sidebar, reads session directly.
-->
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found — School Name</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- Minimal topbar -->
<header>
    <nav class="topbar">
        <a href="/" class="topbar-brand">School Name</a>
        <div class="topbar-right" th:if="${session.userId != null}">
            <span class="topbar-user d-none d-sm-flex">
                <span class="badge-outlined" th:text="${session.role}">role</span>
                <strong th:text="${session.userId}">user</strong>
            </span>
            <a href="/logout" class="btn-topbar">Logout</a>
        </div>
        <div class="topbar-right" th:unless="${session.userId != null}">
            <a href="/login" class="btn-topbar">Login</a>
        </div>
    </nav>
</header>

<div class="app-body">
    <main class="main-content d-flex align-items-center justify-content-center"
          style="min-height: calc(100vh - 52px);">
        <div class="error-box text-center">
            <div class="error-code">404</div>
            <div class="error-title">Page Not Found</div>
            <p class="error-text">
                The page you are looking for doesn't exist or has been moved.<br>
                Check the URL or use the navigation to find what you need.
            </p>
            <div class="d-flex gap-2 justify-content-center flex-wrap">
                <a href="/" class="btn btn-bw">Go Home</a>
                <!-- Show dashboard link when user is logged in -->
                <a th:if="${session.role == 'admin'}"    href="/admin/students"    class="btn btn-bw-outline">Dashboard</a>
                <a th:if="${session.role == 'student'}"  href="/student/profile"   class="btn btn-bw-outline">Dashboard</a>
                <a th:if="${session.role == 'teacher'}"  href="/teacher/profile"   class="btn btn-bw-outline">Dashboard</a>
                <a th:if="${session.role == 'staff'}"    href="/staff/profile"     class="btn btn-bw-outline">Dashboard</a>
            </div>
        </div>
    </main>
</div>

</body>
</html>
