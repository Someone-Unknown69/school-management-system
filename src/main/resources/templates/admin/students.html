<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Manage Students', ~{::section})}">
<head><title>Admin — Manage Students</title></head>
<body>
<section>
    <!-- Breadcrumb -->
    <nav aria-label="breadcrumb" class="breadcrumb-bar">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/admin/dashboard">Dashboard</a></li>
            <li class="breadcrumb-item active" aria-current="page">Students</li>
        </ol>
    </nav>

    <!-- Page Header -->
    <div class="page-header">
        <div>
            <h1 class="page-title">Student Records Management</h1>
            <p class="page-subtitle">Centralized student registry, admissions, and division rosters.</p>
        </div>
        <div>
            <a href="/admin/students/new" class="btn btn-bw">+ Add New Student</a>
        </div>
    </div>

    <!-- Flash Messages -->
    <div th:replace="~{fragments/ui :: flash-messages}"></div>

    <!-- Filter & Search Toolbar -->
    <div class="filter-bar">
        <form method="get" action="/admin/students" class="row g-2 align-items-end">
            <div class="col-sm-6 col-md-3">
                <label class="form-label">Class</label>
                <select name="standard" class="form-select form-select-sm">
                    <option value="">All Classes</option>
                    <option th:each="cls : ${availableClasses}"
                            th:value="${cls}"
                            th:text="'Class ' + ${cls}"
                            th:selected="${cls == standard}"></option>
                </select>
            </div>

            <div class="col-sm-6 col-md-3">
                <label class="form-label">Section</label>
                <select name="division" class="form-select form-select-sm">
                    <option value="">All Sections</option>
                    <option th:each="d : ${availableDivisions}"
                            th:value="${d}"
                            th:text="'Section ' + ${d}"
                            th:selected="${d == division}"></option>
                </select>
            </div>

            <div class="col-sm-8 col-md-4">
                <label class="form-label">Search</label>
                <input type="text" name="search" th:value="${search}" placeholder="Search name or ID..."
                       class="form-control form-control-sm">
            </div>

            <div class="col-auto">
                <button type="submit" class="btn btn-bw btn-sm">Filter</button>
            </div>
            <div class="col-auto" th:if="${(standard != null and standard != '') or (division != null and division != '') or (search != null and search != '')}">
                <a href="/admin/students" class="btn btn-bw-outline btn-sm">Reset</a>
            </div>
        </form>
    </div>

    <!-- Student Table -->
    <div class="table-responsive" th:if="${!#lists.isEmpty(students)}">
        <table class="table">
            <thead>
                <tr>
                    <th style="width: 130px;">Admission No</th>
                    <th style="width: 80px;">Roll No</th>
                    <th>Full Name</th>
                    <th style="width: 80px;">Class</th>
                    <th style="width: 80px;">Section</th>
                    <th style="width: 110px;">House</th>
                    <th style="width: 100px;">Bus No</th>
                    <th style="width: 140px; text-align: right;">Fee Due</th>
                    <th style="width: 160px; text-align: right;">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="s : ${students}">
                    <td><strong th:text="${s.admissionNo}">A001</strong></td>
                    <td th:text="${s.rollNo}">1</td>
                    <td th:text="${s.fullName}">Rohan Mehta</td>
                    <td th:text="${s.standard}">10</td>
                    <td th:text="${s.division}">A</td>
                    <td><span class="badge-outlined" th:text="${s.house}">Red</span></td>
                    <td>
                        <span th:if="${s.vehicleNo != null}" class="badge-outlined" th:text="${s.vehicleNo}">V01</span>
                        <span th:unless="${s.vehicleNo != null}" class="text-muted" style="font-size: 11px;">Day Scholar</span>
                    </td>
                    <td style="text-align: right;">
                        <span th:if="${s.remainingFees > 0}" class="badge-outlined" th:text="'₹' + ${s.remainingFees}">₹5000</span>
                        <span th:unless="${s.remainingFees > 0}" class="badge-filled">Paid</span>
                    </td>
                    <td style="text-align: right; white-space: nowrap;">
                        <a th:href="@{'/admin/students/' + ${s.admissionNo} + '/overview'}"
                           class="btn btn-bw btn-sm me-1">Overview</a>
                        <a th:href="@{'/admin/students/edit/' + ${s.admissionNo}}"
                           class="btn btn-bw-outline btn-sm me-1">Edit</a>
                        
                        <!-- Delete button triggering Confirm Modal -->
                        <button type="button"
                                class="btn btn-bw-outline btn-sm"
                                data-bs-toggle="modal"
                                th:data-bs-target="'#deleteModal-' + ${s.admissionNo}">
                            Delete
                        </button>

                        <!-- Confirm Modal for row -->
                        <div th:replace="~{fragments/ui :: confirm-modal('deleteModal-' + ${s.admissionNo},
                                                                        'Delete Student Record',
                                                                        'Are you sure you want to permanently delete student ' + ${s.fullName} + ' (' + ${s.admissionNo} + ')? This will remove their profile, guardian, and enrollments.',
                                                                        @{'/admin/students/delete/' + ${s.admissionNo}})}"></div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Empty State -->
    <div th:if="${#lists.isEmpty(students)}">
        <div th:replace="~{fragments/ui :: empty-state('👤', 'No Students Found', 'No students match your filter criteria. Try adjusting filters or create a new student record.')}"></div>
    </div>
</section>
</body>
</html>
