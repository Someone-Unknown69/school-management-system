<!DOCTYPE html>
<!--
  error/403.html
  ==============
  Spring Boot serves this automatically when any code calls
  response.sendError(403) — including our RoleInterceptor.

  It uses the B&W design system but does NOT extend the main layout
  because the model attributes (loggedInUser, loggedInRole) that the
  layout sidebar needs are not injected by Spring Boot's error handler.
  Instead we read directly from the session with ${session.userId}.
-->
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 Forbidden — School Name</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- Minimal topbar (reads session directly) -->
<header>
    <nav class="topbar">
        <a href="/" class="topbar-brand">School Name</a>
        <div class="topbar-right" th:if="${session.userId != null}">
            <span class="topbar-user d-none d-sm-flex">
                <span class="badge-outlined" th:text="${session.role}">role</span>
                <strong th:text="${session.userId}">user</strong>
            </span>
            <a href="/logout" class="btn-topbar">Logout</a>
        </div>
        <div class="topbar-right" th:unless="${session.userId != null}">
            <a href="/login" class="btn-topbar">Login</a>
        </div>
    </nav>
</header>

<div class="app-body">
    <main class="main-content d-flex align-items-center justify-content-center"
          style="min-height: calc(100vh - 52px);">
        <div class="error-box text-center">
            <div class="error-code">403</div>
            <div class="error-title">Access Denied</div>
            <p class="error-text">
                You don't have permission to view this page.<br>
                Please make sure you are signed in with the correct account.
            </p>
            <div class="d-flex gap-2 justify-content-center flex-wrap">
                <a href="/" class="btn btn-bw">Go Home</a>
                <a href="/logout" class="btn btn-bw-outline">Sign out &amp; switch account</a>
            </div>
        </div>
    </main>
</div>

</body>
</html>
